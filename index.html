<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北辰射箭計分運科系統 v1.7.0</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold: #ffd700; --text: #ffffff; --grid-border: #333; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 440px; }
        .svg-holder { width: 100%; max-width: 290px; height: 290px; margin: 0 auto; background: #1a1a1a; touch-action: none; overflow: hidden; }
        .active-cell { background-color: rgba(255, 215, 0, 0.3) !important; border: 2px solid var(--gold) !important; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        th, td { border: 1px solid #333; padding: 4px; }
        #arrowGroup circle { transition: all 0.2s ease; }
    </style>
</head>
<body>

<div class="container">
    <h3>北辰射箭計分系統</h3>
    <div id="targetWrapper">
        <div class="svg-holder" id="svgHolder">
            <svg id="archeryTarget" viewBox="0 0 300 300">
                <rect x="0" y="0" width="300" height="300" fill="#ffffff" id="whiteTargetBackground"/>
                <g id="targetDynamicRingsGroup"></g>
                <g id="clusterLayerGroup"></g>
                <g id="arrowGroup"></g>
            </svg>
        </div>
    </div>
    </div>

<script>
    // 核心變數
    let scale = 1, posX = 0, posY = 0;
    const svg = document.getElementById('archeryTarget');
    const arrowGroup = document.getElementById('arrowGroup');

    // [新增] 點靶記分邏輯
    svg.addEventListener('click', function(e) {
        if (!document.getElementById('chkScoreMode').checked) return;
        
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        
        registerArrow(svgP.x, svgP.y);
    });

    function registerArrow(x, y) {
        if (currentEnd >= TOTAL_ROWS) return;
        
        // 判定分數 (以中心 150, 150 計算)
        const dx = x - 150;
        const dy = y - 150;
        const dist = Math.sqrt(dx*dx + dy*dy);
        // 簡單邏輯：半徑 150 分為 10 圈
        let score = Math.max(0, 10 - Math.floor(dist / 15));
        if (dist > 150) score = "M";
        
        // 更新數據陣列
        fullRoundData[currentEnd].push({ x, y, score });
        renderArrow(x, y, score);
        updateTable(score);
    }

    function renderArrow(x, y, score) {
        let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", x);
        circle.setAttribute("cy", y);
        circle.setAttribute("r", "5");
        circle.setAttribute("fill", score === "M" ? "red" : "black");
        arrowGroup.appendChild(circle);
    }

    function updateTable(score) {
        const cell = document.getElementById(`cell-${currentEnd}-${currentIndex}`);
        if(cell) cell.textContent = score;
        
        currentIndex++;
        if (currentIndex >= ARROWS_PER_END) {
            currentIndex = 0;
            currentEnd++;
        }
        updateActiveHighlight();
        calculateMetrics(); // 計算運科指標
    }

    function calculateMetrics() {
        const activeArrows = fullRoundData.flat().filter(a => a.score !== "M");
        if (activeArrows.length === 0) return;
        
        // 簡單均值計算範例
        const avgX = activeArrows.reduce((s, a) => s + a.x, 0) / activeArrows.length;
        document.getElementById('mAccuracy').textContent = Math.round(Math.abs(avgX - 150)) + " px";
        // 實際開發中可加入標準差公式
    }

    // 縮放與平移處理 (Pan & Zoom)
    let isPanning = false;
    svg.addEventListener('pointerdown', e => isPanning = true);
    svg.addEventListener('pointermove', e => {
        if (!isPanning) return;
        posX += e.movementX; posY += e.movementY;
        svg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    });
    svg.addEventListener('pointerup', () => isPanning = false);
    
    // 初始化靶紙
    updateSvgTargetSkin();
</script>
</body>
</html>
