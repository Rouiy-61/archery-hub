<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北辰射箭計分系統 v1.4.3</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #ffd700;
            --text: #ffffff;
            --grid-border: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            position: relative;
        }
        .container { width: 100%; max-width: 440px; box-sizing: border-box; display: flex; flex-direction: column; }
        h3 { text-align: center; color: var(--gold); margin: 5px 0; }
        .setup-overlay { background: var(--card-bg); border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-bottom: 12px; text-align: center; }
        .setup-overlay select, .setup-overlay input { background: #2b2b2b; color: white; border: 1px solid #444; padding: 6px; border-radius: 4px; margin: 5px; font-size: 14px; }
        .score-table-container { width: 100%; background: var(--card-bg); border-radius: 8px; overflow-y: auto; max-height: 130px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 11px; }
        th, td { border: 1px solid var(--grid-border); padding: 4px 2px; }
        th { background-color: #2a2a2a; color: #aaa; }
        .active-cell { background-color: rgba(255, 215, 0, 0.25) !important; border: 2px solid var(--gold) !important; }
        .end-total { background-color: #2d2d2d; font-weight: bold; color: #2ecc71; }
        .tech-grid { display: grid; grid-template-columns: 110px 1fr; gap: 8px; width: 100%; margin-bottom: 10px; }
        .timer-zone { display: flex; flex-direction: column; gap: 4px; }
        .timer-box { background: #000; border: 2px solid #333; border-radius: 8px; padding: 6px 0; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; flex-grow: 1; }
        .timer-box.prep-phase { border-color: #ff3333; box-shadow: inset 0 0 10px rgba(255,51,51,0.5); }
        .timer-box.shoot-phase { border-color: #2ecc71; box-shadow: inset 0 0 10px rgba(46,204,113,0.5); }
        .timer-digital { font-size: 26px; font-weight: bold; color: #2ecc71; font-family: monospace; }
        .timer-status { font-size: 9px; color: #aaa; text-align: center; line-height: 1.2; }
        .reset-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 5px 0; font-size: 11px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
        .metrics-box { background: #151f28; border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; justify-content: space-around; font-size: 11px; cursor: pointer; }
        .metric-line span { color: var(--gold); font-weight: bold; float: right; }
        .desc-panel { display: none; width: 100%; background: #22313f; border-left: 4px solid #3498db; padding: 8px; border-radius: 4px; font-size: 11px; color: #eceff1; margin-bottom: 10px; }
        .main-display-zone { width: 100%; background: var(--card-bg); border-radius: 12px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; min-height: 380px; }
        .svg-holder { width: 100%; max-width: 290px; height: 290px; position: relative; overflow: hidden; background: #1a1a1a; border-radius: 8px; touch-action: none; }
        svg { width: 100%; height: 100%; transform-origin: 0px 0px; transition: transform 0.05s ease-out; }
        #videoWrapper { width: 100%; display: none; flex-direction: column; align-items: center; }
        #camCanvas { width: 100%; max-width: 320px; height: 240px; background: #000; border-radius: 8px; transform: scaleX(-1); }
        .control-mode-bar { width: 100%; background: #252a30; padding: 10px 6px; border-radius: 8px; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-toggle-ctl { display: flex; align-items: center; justify-content: center; gap: 4px; background: #1e1e1e; padding: 8px 4px; border-radius: 5px; border: 1px solid #555; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-view-switch { grid-column: span 2; background: linear-gradient(135deg, #3498db, #2980b9); color: white; padding: 8px; font-size: 12px; font-weight: bold; border-radius: 5px; border: none; cursor: pointer; }
        .toggle-layer-box { width: 100%; margin-top: 8px; padding: 6px; background: #252525; border-radius: 6px; font-size: 11px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; width: 100%; }
        .action-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .submit-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .back-btn { background: #333; color: white; }
    </style>
</head>
<body>

<div class="setup-overlay" id="setupPanel">
    <label style="font-weight: bold; color: var(--gold);">🛠️ 本局測驗與計時規格設定</label><br>
    <div>
        選手 ID：<input type="text" id="cfgAthleteId" value="BC-001" style="width: 80px;"><br>
        選手姓名：<input type="text" id="cfgUserId" value="未輸入" style="width: 80px;"><br>
        總箭數：
        <select id="cfgTotalArrows"><option value="36">36 箭</option><option value="72" selected>72 箭</option></select><br>
        預備/射擊：<input type="number" id="cfgPrepSec" value="10" style="width: 40px;"> / <input type="number" id="cfgShootSec" value="90" style="width: 40px;"> 秒
    </div>
    <button onclick="startSession()" id="btnStartGame" style="margin-top:12px; padding:10px; width:90%; font-weight:bold; background: linear-gradient(135deg, #e67e22, #d35400); color:white; border:none; border-radius:6px; cursor:pointer;">🎯 開始</button>
</div>

<div class="score-table-container">
    <table>
        <thead><tr><th>組</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>本組</th><th>累計</th></tr></thead>
        <tbody id="scoreTableBody"></tbody>
    </table>
</div>

<div class="tech-grid">
    <div class="timer-zone">
        <div id="timerContainer" class="timer-box" onclick="toggleTimer()">
            <div id="timerDisplay" class="timer-digital">10</div>
            <div id="timerStatus" class="timer-status">⏱️ 點擊啟動</div>
        </div>
        <button class="reset-btn" onclick="resetTimer()">🔄 重置</button>
    </div>
    <div class="metrics-box" onclick="toggleDescPanel()">
        <div class="metric-line">🎯 偏移: <span id="mAccuracy">--</span></div>
        <div class="metric-line">🧬 密集: <span id="mPrecision">--</span></div>
        <div class="metric-line">⚡ 穩定: <span id="mStability">--</span></div>
        <div class="metric-line">📊 均值: <span id="mEndAvg">--</span></div>
    </div>
</div>

<div id="descPanel" class="desc-panel">📊 數值說明：偏移(Accuracy)、密集(Precision)、穩定(Stability)</div>

<div class="main-display-zone">
    <div id="targetWrapper">
        <div class="svg-holder" id="svgHolder">
            <svg id="archeryTarget" viewBox="0 0 300 300">
                <rect x="0" y="0" width="300" height="300" fill="#ffffff" id="whiteTargetBackground"/>
                <circle cx="150" cy="150" r="150" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="90" fill="#00bfff" stroke="#0099cc" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="60" fill="#ff4500" stroke="#cc3300" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="30" fill="#ffd700" stroke="#e6b800" stroke-width="0.5"/>
                <g id="clusterLayerGroup"></g><g id="arrowGroup"></g>
            </svg>
        </div>
        <div class="control-mode-bar">
            <label class="btn-toggle-ctl"><input type="checkbox" id="chkScoreMode"> 📌 開啟點靶</label>
            <label class="btn-toggle-ctl"><input type="checkbox" id="chkCamActive" onchange="toggleCameraHardware()"> 📷 錄影</label>
            <button class="btn-view-switch" onclick="switchMainView()">🔄 切換視窗</button>
        </div>
    </div>
    <div id="videoWrapper"><canvas id="camCanvas"></canvas></div>
    <div class="toggle-layer-box" id="layerToggleBox"></div>
</div>

<div class="btn-group">
    <button class="action-btn back-btn" onclick="undoLastArrow()">↩️ 修改上一箭</button>
    <button class="action-btn submit-btn" id="btnUpload" onclick="sendAllToSheets()" disabled>💾 請先完成總箭數</button>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwCb_KTxft7lR6q-DIzQvi_oMgg12CSIw-cLC_NAsU33BRE0e9FtruqWIE6diPR1Qny-g/exec";
    let TOTAL_ROWS = 0, TOTAL_ARROWS_LIMIT = 0, fullRoundData = [], currentEnd = 0, currentIndex = 0, globalArrowCount = 0;
    const STORM_COLORS = [{inner:"rgba(255,0,255,0.4)",outer:"rgba(255,0,255,0.12)"},{inner:"rgba(0,255,255,0.45)",outer:"rgba(0,255,255,0.12)"},{inner:"rgba(255,165,0,0.45)",outer:"rgba(255,165,0,0.12)"}];

    function startSession() {
        GLOBAL_ATHLETE_ID = document.getElementById('cfgAthleteId').value;
        GLOBAL_USER_NAME = document.getElementById('cfgUserId').value;
        TOTAL_ARROWS_LIMIT = parseInt(document.getElementById('cfgTotalArrows').value);
        TOTAL_ROWS = TOTAL_ARROWS_LIMIT / 6;
        fullRoundData = Array.from({ length: TOTAL_ROWS }, () => []);
        document.getElementById('setupPanel').style.display = 'none';
        initTable(); initToggleCheckboxes(); initPanZoomTarget();
    }

    function initTable() {
        const body = document.getElementById('scoreTableBody');
        for (let e = 0; e < TOTAL_ROWS; e++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${e+1}</td>` + Array(6).fill(0).map((_,a) => `<td id="cell-${e}-${a}">-</td>`).join('') + `<td class="end-total" id="endTotal-${e}">0</td><td id="runTotal-${e}">0</td>`;
            body.appendChild(tr);
        }
    }

    function recalculateTotals() {
        let globalRunning = 0;
        for (let e = 0; e < TOTAL_ROWS; e++) {
            let endScore = 0;
            fullRoundData[e].forEach(a => { if (a) endScore += a.score; });
            document.getElementById(`endTotal-${e}`).textContent = endScore;
            globalRunning += endScore;
            document.getElementById(`runTotal-${e}`).textContent = globalRunning;
        }
    }

    function undoLastArrow() {
        if (globalArrowCount > 0) {
            globalArrowCount--;
            if (currentIndex === 0) { currentEnd--; currentIndex = 5; } else { currentIndex--; }
            fullRoundData[currentEnd][currentIndex] = undefined;
            document.getElementById(`cell-${currentEnd}-${currentIndex}`).textContent = "-";
            recalculateTotals();
        }
    }

    async function sendAllToSheets() {
        const btn = document.getElementById('btnUpload');
        btn.textContent = "⏳ 上傳中...";
        try {
            await fetch(GAS_API_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ athleteId: GLOBAL_ATHLETE_ID, data: fullRoundData }) });
            alert("上傳成功"); btn.textContent = "✅ 已上傳";
        } catch (e) { alert("上傳失敗"); btn.textContent = "💾 重新嘗試"; }
    }
</script>
</body>
</html>
