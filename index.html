<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北辰射箭計分系統 v1.4.3</title>
    <style>
        /* (CSS 樣式保持不變，略過以節省篇幅) */
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold: #ffd700; --text: #ffffff; --grid-border: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 440px; }
        h3 { text-align: center; color: var(--gold); margin: 5px 0; }
        .score-table-container { width: 100%; background: var(--card-bg); border-radius: 8px; overflow-y: auto; max-height: 130px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 11px; }
        th, td { border: 1px solid var(--grid-border); padding: 4px 2px; }
        .active-cell { background-color: rgba(255, 215, 0, 0.25) !important; border: 2px solid var(--gold) !important; }
        .btn-group { display: flex; gap: 8px; margin-top: 10px; width: 100%; }
        button.action-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .submit-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
    </style>
</head>
<body>
<div class="container">
    <h3>北辰射箭計分系統</h3>
    <div class="score-table-container"><table><tbody id="scoreTableBody"></tbody></table></div>
    <div class="btn-group">
        <button class="action-btn submit-btn" id="btnUpload" onclick="sendAllToSheets()">💾 同步至雲端資料庫</button>
    </div>
</div>

<script>
    // 已更新為最新的 GAS 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyX2AiQG_WWYzWJqIxbTJ3EeBaRvRk-CK7Ai3OnNsWvX4GpNMQMq9_vVGpFZu0U2w1JFQ/exec";

    async function sendAllToSheets() {
        const upBtn = document.getElementById('btnUpload');
        upBtn.disabled = true;
        upBtn.textContent = "⚡ 傳輸中...";

        // 測試連線
        try {
            const response = await fetch(GAS_API_URL, {
                method: "POST",
                mode: "no-cors", // 嘗試使用 no-cors 模式規避跨域
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "test" })
            });
            alert("✅ 連線成功！Google 後端已接收到訊號。");
        } catch (err) {
            console.error("錯誤細節:", err);
            alert("❌ 同步失敗，請查看瀏覽器 F12 Console 錯誤訊息。");
        } finally {
            upBtn.disabled = false;
            upBtn.textContent = "💾 同步至雲端資料庫";
        }
    }
</script>
</body>
</html>
