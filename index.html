<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北辰射箭運科管理系統 - 計時與靶紙配置</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .setup-panel {
            background: #1e1e1e; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #aaa;
        }
        select, input {
            width: 100%; 
            padding: 10px; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        select:focus, input:focus {
            border-color: #ffb703;
            outline: none;
        }
        /* 專用計時顯示面板 */
        .timer-display-box {
            background: #000000;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            border: 2px solid #222;
        }
        #timerStatus {
            font-size: 16px;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        #timerClock {
            font-size: 54px;
            font-weight: bold;
            color: #ff4d4d; /* 預設為預備狀態的紅色 */
            font-family: monospace;
            margin: 10px 0;
        }
        /* 按鈕控制區 */
        .control-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background-color: #ffb703; color: #000; }
        .btn-start:hover { background-color: #fb8500; }
        .btn-reset { background-color: #d90429; color: #fff; }
        .btn-reset:hover { background-color: #b3001b; }
        
        /* 靶紙畫布容器 */
        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }
        #scoreCanvas {
            background: #1e1e1e;
            border-radius: 8px;
            max-width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="setup-panel">
        <h3 style="margin-top:0; color: #ffb703; font-size: 18px;">🎯 賽制與靶紙配置</h3>
        
        <div class="form-group">
            <label>選擇賽制：</label>
            <select id="matchTypeSelect" onchange="handleMatchTypeChange()">
                <option value="custom">⚙️ 自定義賽制</option>
                <option value="double_72">🏆 雙局排名賽 (72箭)</option>
                <option value="single_36">🥇 單局排名賽 (36箭)</option>
                <option value="public_18">👥 公開組賽制 (18箭)</option>
                <option value="test_6">🧪 系統測試模式 (6箭)</option>
            </select>
        </div>

        <div id="customArrowsArea" style="display: flex; gap: 10px; margin-bottom: 12px;">
            <div style="flex: 1;">
                <label style="font-size: 12px;">總箭數：</label>
                <input type="number" id="totalArrowsInput" value="36" min="1">
            </div>
            <div style="flex: 1;">
                <label style="font-size: 12px;">每趟箭數：</label>
                <input type="number" id="arrowsPerEndInput" value="6" min="1" max="6">
            </div>
        </div>

        <div class="form-group">
            <label>距離與靶紙規格 (WA國際標準)：</label>
            <select id="targetSizeSelect" onchange="drawTargetPaper()">
                <option value="70m_90m">🎯 70公尺 / 90公尺 (122cm 全靶 - 1~10分)</option>
                <option value="60m">🎯 60公尺 (122cm 全靶 - 1~10分)</option>
                <option value="50m_compound">🎯 50公尺 複合弓 (80cm 六環靶 - 5~10分)</option>
                <option value="30m_recurve">🎯 30公尺 反曲弓 (80cm 全靶 - 1~10分)</option>
                <option value="18m_indoor">🎯 18公尺 室內賽 (40cm 全靶 - 1~10分)</option>
                <option value="triple_target">🎯 18公尺 三環靶 (三連體 - 6~10分)</option>
            </select>
        </div>
    </div>

    <div class="timer-display-box">
        <div id="timerStatus">準備中 PREPARE</div>
        <div id="timerClock">10</div>
    </div>

    <div class="control-buttons">
        <button class="btn btn-start" id="startBtn" onclick="startTimer()">🎯 開局！</button>
        <button class="btn btn-reset" id="resetBtn" onclick="resetTimer()">🔄 重設計時</button>
    </div>

    <div class="canvas-container">
        <canvas id="scoreCanvas" width="380" height="380"></canvas>
    </div>

    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playBeep(type) {
            if (!audioCtx) audioCtx = new AudioCtx();
            
            const now = audioCtx.currentTime;
            
            if (type === 'prep_2short') {
                // 預備階段：逼、逼（兩聲短音）
                createBeepSound(440, 0.15, now);
                createBeepSound(440, 0.15, now + 0.25);
            } else if (type === 'shoot_1short') {
                // 射擊階段：逼（一聲短音）
                createBeepSound(440, 0.25, now);
            } else if (type === 'timeup_1long') {
                // 時間截止：逼一一一（一聲長音 1.2秒）
                createBeepSound(440, 1.2, now);
            }
        }

        function createBeepSound(frequency, duration, startTime) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequency, startTime);
            gain.gain.setValueAtTime(0.3, startTime);
            // 消除爆音的淡出處理
            gain.gain.exponentialRampToValueAtTime(0.00001, startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }
    </script>

    <script>
        // 賽制內建規格
        const MATCH_CONFIGS = {
            double_72: { total: 72, perEnd: 6 },
            single_36: { total: 36, perEnd: 6 },
            public_18: { total: 18, perEnd: 3 },
            test_6:    { total: 6,  perEnd: 3 }
        };

        // 計時器全域變數
        let timerInterval = null;
        let currentPhase = 'idle'; // idle, prep, shoot, finished
        let timeLeft = 10;

        // 當賽制選單改變
        function handleMatchTypeChange() {
            const select = document.getElementById('matchTypeSelect');
            const customArea = document.getElementById('customArrowsArea');
            const totalInput = document.getElementById('totalArrowsInput');
            const perEndInput = document.getElementById('arrowsPerEndInput');
            
            if (select.value === 'custom') {
                customArea.style.opacity = "1";
                totalInput.disabled = false;
                perEndInput.disabled = false;
            } else {
                const config = MATCH_CONFIGS[select.value];
                totalInput.value = config.total;
                perEndInput.value = config.perEnd;
                customArea.style.opacity = "0.5";
                totalInput.disabled = true;
                perEndInput.disabled = true;
            }
        }

        // 啟動計時器核心邏輯
        function startTimer() {
            if (timerInterval) return; // 避免重複觸發

            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').style.opacity = "0.5";

            // 1. 進入【預備階段】：10秒倒數，變紅燈，響兩聲短音
            currentPhase = 'prep';
            timeLeft = 10;
            updateTimerUI("預備階段 PREPARE", "#ff4d4d");
            playBeep('prep_2short');

            timerInterval = setInterval(() => {
                timeLeft--;
                
                if (currentPhase === 'prep') {
                    if (timeLeft > 0) {
                        document.getElementById('timerClock').innerText = timeLeft;
                    } else {
                        // 2. 預備結束 -> 進入【射擊階段】：90秒倒數，變綠燈，響一聲短音
                        currentPhase = 'shoot';
                        timeLeft = 90; // 可以根據每趟箭數動態計算，此處採 WA 標準單人 90秒
                        updateTimerUI("射擊開始 SHOOT", "#00b4d8");
                        playBeep('shoot_1short');
                    }
                } else if (currentPhase === 'shoot') {
                    // 黃金10秒警告燈號切換
                    if (timeLeft <= 10 && timeLeft > 0) {
                        document.getElementById('timerClock').style.color = "#ffb703"; // 轉黃燈
                        document.getElementById('timerStatus').innerText = "倒數警告 WARNING";
                    }

                    if (timeLeft > 0) {
                        document.getElementById('timerClock').innerText = timeLeft;
                    } else {
                        // 3. 時間截止：變回紅燈，響一聲長音
                        clearInterval(timerInterval);
                        timerInterval = null;
                        currentPhase = 'finished';
                        updateTimerUI("時間截止 TIME UP", "#ef233c");
                        playBeep('timeup_1long');
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('startBtn').style.opacity = "1";
                    }
                }
            }, 1000);
        }

        // ✨ 核心亮點：免刷新「重設計時」功能
        function resetTimer() {
            // 1. 強行停止定時執行緒
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // 2. 還原狀態變數
            currentPhase = 'idle';
            timeLeft = 10;

            // 3. 還原網頁 UI 顯示與顏色
            const clockEl = document.getElementById('timerClock');
            const statusEl = document.getElementById('timerStatus');
            const startBtnEl = document.getElementById('startBtn');

            clockEl.innerText = "10";
            clockEl.style.color = "#ff4d4d"; // 恢復預備紅
            statusEl.innerText = "準備中 PREPARE";
            statusEl.style.color = "#888";

            // 4. 解鎖「開局！」按鈕
            startBtnEl.disabled = false;
            startBtnEl.style.opacity = "1";
            
            console.log("計時器已成功重置，無須刷新網頁。");
        }

        function updateTimerUI(statusText, clockColor) {
            document.getElementById('timerStatus').innerText = statusText;
            document.getElementById('timerClock').innerText = timeLeft;
            document.getElementById('timerClock').style.color = clockColor;
        }
    </script>

    <script>
        function drawTargetPaper() {
            const canvas = document.getElementById('scoreCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const maxRadius = Math.min(w, h) * 0.46;
            
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = "#1e1e1e"; 
            ctx.fillRect(0, 0, w, h);
            
            const targetType = document.getElementById('targetSizeSelect').value;

            const COLOR_WHITE  = "#FFFFFF";
            const COLOR_BLACK  = "#111111";
            const COLOR_BLUE   = "#00a8ff";
            const COLOR_RED    = "#ff4d4d";
            const COLOR_YELLOW = "#ffee22";

            function drawSingleStandardTarget(centerX, centerY, radius) {
                const rings = [
                    { ring: 1,  color: COLOR_WHITE },
                    { ring: 2,  color: COLOR_WHITE },
                    { ring: 3,  color: COLOR_BLACK },
                    { ring: 4,  color: COLOR_BLACK },
                    { ring: 5,  color: COLOR_BLUE },
                    { ring: 6,  color: COLOR_BLUE },
                    { ring: 7,  color: COLOR_RED },
                    { ring: 8,  color: COLOR_RED },
                    { ring: 9,  color: COLOR_YELLOW },
                    { ring: 10, color: COLOR_YELLOW }
                ];

                let startRingIdx = 0;
                if (targetType === "50m_compound") {
                    startRingIdx = 4; // 複合弓取5~10分
                } else if (targetType === "triple_target") {
                    startRingIdx = 5; // 三環靶取6~10分
                }

                const activeRings = rings.slice(startRingIdx);
                const step = radius / activeRings.length;

                activeRings.forEach((r, index) => {
                    const currentRadius = radius - (index * step);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, currentRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = r.color;
                    ctx.fill();
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = (r.color === COLOR_BLACK) ? "#555" : "#ccc";
                    ctx.stroke();
                    
                    // 內10分/X環線
                    if (r.ring === 10) {
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, currentRadius * 0.5, 0, 2 * Math.PI);
                        ctx.strokeStyle = "rgba(0,0,0,0.3)";
                        ctx.setLineDash([2, 2]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
            }

            if (targetType === "triple_target") {
                const tripleRadius = h * 0.12;
                const spacing = h * 0.29;
                drawSingleStandardTarget(cx, cy - spacing, tripleRadius);
                drawSingleStandardTarget(cx, cy,           tripleRadius);
                drawSingleStandardTarget(cx, cy + spacing, tripleRadius);
            } else {
                drawSingleStandardTarget(cx, cy, maxRadius);
            }
        }

        // 初始化繪製
        window.addEventListener('DOMContentLoaded', () => {
            handleMatchTypeChange();
            drawTargetPaper();
        });
    </script>
</body>
</html>
