<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北辰射箭計分系統 (完整版)</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold: #ffd700; --text: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 10px; }
        .svg-holder { width: 100%; max-width: 290px; height: 290px; margin: 0 auto; background: #fff; cursor: crosshair; }
        .control-panel { max-width: 440px; margin: 10px auto; }
        table { width: 100%; border-collapse: collapse; color: #fff; }
        th, td { border: 1px solid #444; padding: 5px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

<div class="control-panel">
    <button onclick="exportJSON()">💾 導出數據 JSON</button>
    <table id="scoreTable">
        <tbody id="scoreTableBody"></tbody>
    </table>
    
    <div class="svg-holder">
        <svg id="archeryTarget" viewBox="0 0 300 300">
            <g id="targetDynamicRingsGroup"></g>
            <g id="arrowGroup"></g>
        </svg>
    </div>
</div>

<script>
    let fullRoundData = [[],[],[],[],[],[],[],[],[],[],[],[]]; // 簡化為 12 趟
    let currentEnd = 0, currentIndex = 0;

    // 1. 繪製靶紙 (解決空白問題)
    function drawTarget() {
        const group = document.getElementById('targetDynamicRingsGroup');
        group.innerHTML = "";
        for (let i = 10; i >= 1; i--) {
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", 150);
            circle.setAttribute("cy", 150);
            circle.setAttribute("r", i * 15);
            circle.setAttribute("fill", i % 2 === 0 ? (i > 8 ? "gold" : (i > 6 ? "red" : (i > 4 ? "blue" : "black"))) : "white");
            circle.setAttribute("stroke", "black");
            group.appendChild(circle);
        }
    }

    // 2. 點擊判斷 M 與得分
    document.getElementById('archeryTarget').addEventListener('click', function(e) {
        const svg = e.currentTarget;
        const pt = svg.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
        
        const dx = svgP.x - 150;
        const dy = svgP.y - 150;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // 超出 150px 直接判定為 M
        let score = dist > 150 ? "M" : Math.max(1, 10 - Math.floor(dist / 15));
        
        recordArrow(score, svgP.x, svgP.y);
    });

    function recordArrow(score, x, y) {
        if(currentEnd >= 12) return;
        fullRoundData[currentEnd].push({score, x, y});
        
        // 在 SVG 上畫點
        let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", x); circle.setAttribute("cy", y);
        circle.setAttribute("r", 3); circle.setAttribute("fill", "lime");
        document.getElementById('arrowGroup').appendChild(circle);
        
        currentIndex++;
        if(currentIndex >= 6) { currentIndex = 0; currentEnd++; }
    }

    // 3. 匯出 JSON
    function exportJSON() {
        const dataStr = JSON.stringify(fullRoundData, null, 2);
        const blob = new Blob([dataStr], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "ArcheryData_" + new Date().toISOString().slice(0,10) + ".json";
        a.click();
    }

    drawTarget();
</script>
</body>
</html>
