<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北辰射箭計分系統 v1.4.3 完整版</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --gold: #ffd700; --text: #ffffff; --grid-border: #333; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 440px; box-sizing: border-box; }
        .setup-overlay { background: var(--card-bg); border: 2px solid var(--gold); padding: 15px; border-radius: 12px; text-align: center; }
        .score-table-container { width: 100%; background: var(--card-bg); border-radius: 8px; margin: 10px 0; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        th, td { border: 1px solid var(--grid-border); padding: 5px; }
        .svg-holder { width: 100%; max-width: 300px; height: 300px; margin: 10px auto; background: #1a1a1a; border-radius: 8px; cursor: crosshair; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .submit-btn { background: #2ecc71; }
        .back-btn { background: #333; }
    </style>
</head>
<body>

<div class="container">
    <div id="setupPanel" class="setup-overlay">
        <h3>北辰射箭計分系統</h3>
        選手姓名：<input type="text" id="cfgUserId" value="選手"><br>
        <button onclick="startSession()" style="margin-top:10px; width:100%; background:#e67e22;">🎯 開始測驗</button>
    </div>

    <div class="score-table-container">
        <table>
            <thead><tr><th>組</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>總分</th></tr></thead>
            <tbody id="scoreTableBody"></tbody>
        </table>
    </div>

    <div class="svg-holder" id="svgHolder">
        <svg id="archeryTarget" viewBox="0 0 300 300" width="300" height="300">
            <rect x="0" y="0" width="300" height="300" fill="#ffffff"/>
            <circle cx="150" cy="150" r="150" fill="none" stroke="#000" stroke-width="1"/>
            <g id="arrowGroup"></g>
        </svg>
    </div>

    <div class="btn-group">
        <button class="back-btn" onclick="undoLastArrow()">↩️ 刪除</button>
        <button class="submit-btn" id="btnUpload" onclick="sendAllToSheets()">💾 上傳雲端</button>
    </div>
</div>

<script>
    // ⚠️ 請填入您最新的 GAS 網址
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyiTShlrYsDgAoZYCf0gigE81B720-WRy-U4WaTo6Laww6EWM_SXqDCwZu5LlO27KUGzg/exec";
    let dataStore = Array.from({length: 12}, () => []), currentEnd = 0, currentIndex = 0;

    function startSession() { document.getElementById('setupPanel').style.display = 'none'; initTable(); }

    function initTable() {
        const tbody = document.getElementById('scoreTableBody');
        for (let i = 0; i < 12; i++) {
            tbody.innerHTML += `<tr><td>${i+1}</td>${[0,1,2,3,4,5].map(a => `<td id="cell-${i}-${a}">-</td>`).join('')}<td id="total-${i}">0</td></tr>`;
        }
    }

    document.getElementById('archeryTarget').addEventListener('pointerdown', function(e) {
        const rect = this.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 300;
        const y = ((e.clientY - rect.top) / rect.height) * 300;
        const dist = Math.sqrt(Math.pow(x-150, 2) + Math.pow(y-150, 2));
        const score = Math.max(0, 10 - Math.floor(dist/15));

        if (currentEnd < 12) {
            dataStore[currentEnd][currentIndex] = {x, y, score};
            document.getElementById(`cell-${currentEnd}-${currentIndex}`).textContent = score;
            renderArrows();
            currentIndex++;
            if (currentIndex > 5) { currentIndex = 0; currentEnd++; }
            updateTotals();
        }
    });

    function renderArrows() {
        const g = document.getElementById('arrowGroup'); g.innerHTML = "";
        dataStore.flat().forEach(a => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", a.x); c.setAttribute("cy", a.y); c.setAttribute("r", "4"); c.setAttribute("fill", "#000");
            g.appendChild(c);
        });
    }

    function updateTotals() {
        dataStore.forEach((end, i) => {
            document.getElementById(`total-${i}`).textContent = end.reduce((a, b) => a + b.score, 0);
        });
    }

    function undoLastArrow() {
        if (currentIndex > 0 || currentEnd > 0) {
            if (currentIndex === 0) { currentIndex = 5; currentEnd--; } else { currentIndex--; }
            dataStore[currentEnd][currentIndex] = null;
            document.getElementById(`cell-${currentEnd}-${currentIndex}`).textContent = "-";
            updateTotals(); renderArrows();
        }
    }

    async function sendAllToSheets() {
        const btn = document.getElementById('btnUpload');
        btn.textContent = "傳送中...";
        try {
            const res = await fetch(GAS_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    athleteId: "BC-001",
                    userId: document.getElementById('cfgUserId').value,
                    data: dataStore
                })
            });
            alert("資料同步成功！");
        } catch (e) {
            alert("同步失敗，請檢查網路連線或 CORS 部署設定。");
        } finally { btn.textContent = "💾 上傳雲端"; }
    }
</script>
</body>
</html>
