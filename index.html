<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北辰射箭紀錄表 v1.3.0</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #ffd700;
            --text: #ffffff;
            --grid-border: #333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text);
            margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center;
            position: relative;
        }
        .container { width: 100%; max-width: 440px; box-sizing: border-box; }
        h3 { text-align: center; color: var(--gold); margin: 5px 0; }

        /* 初始設定面板 */
        .setup-overlay {
            background: var(--card-bg); border: 2px solid var(--gold); border-radius: 12px;
            padding: 15px; margin-bottom: 12px; text-align: center;
        }
        .setup-overlay select, .setup-overlay input {
            background: #2b2b2b; color: white; border: 1px solid #444;
            padding: 6px; border-radius: 4px; margin: 5px; font-size: 14px;
        }

        /* 記分表容器 */
        .score-table-container {
            width: 100%; background: var(--card-bg); border-radius: 8px;
            overflow-y: auto; max-height: 130px; margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 11px; }
        th, td { border: 1px solid var(--grid-border); padding: 4px 2px; }
        th { background-color: #2a2a2a; color: #aaa; }
        .active-cell { background-color: rgba(255, 215, 0, 0.25) !important; border: 2px solid var(--gold) !important; }
        .end-total { background-color: #2d2d2d; font-weight: bold; color: #2ecc71; }

        /* 計時與黑科技柵格 */
        .tech-grid {
            display: grid; grid-template-columns: 110px 1fr; gap: 8px; width: 100%; margin-bottom: 10px;
        }
        .timer-zone { display: flex; flex-direction: column; gap: 4px; }
        .timer-box {
            background: #000; border: 2px solid #333; border-radius: 8px; padding: 6px 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; flex-grow: 1;
        }
        .timer-box.prep-phase { border-color: #ff3333; box-shadow: inset 0 0 10px rgba(255,51,51,0.5); }
        .timer-box.shoot-phase { border-color: #2ecc71; box-shadow: inset 0 0 10px rgba(46,204,113,0.5); }
        .timer-digital { font-size: 26px; font-weight: bold; color: #2ecc71; font-family: monospace; }
        .timer-status { font-size: 9px; color: #aaa; text-align: center; line-height: 1.2; }
        .reset-btn {
            background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 4px 0;
            font-size: 11px; font-weight: bold; cursor: pointer; width: 100%; text-align: center;
        }

        .metrics-box {
            background: #151f28; border-radius: 8px; padding: 8px;
            display: flex; flex-direction: column; justify-content: space-around; font-size: 12px;
        }
        .metric-line { margin: 2px 0; }
        .metric-line span { color: var(--gold); font-weight: bold; float: right; }

        /* 💡 核心優化：大畫面切換控制區 */
        .view-switch-btn {
            width: 100%; background: linear-gradient(135deg, #3498db, #2980b9); color: white;
            padding: 10px; font-size: 13px; font-weight: bold; border-radius: 8px; border: none;
            margin-bottom: 10px; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        
        /* 雙主視窗容器 (靶紙與錄影同大，互相切換) */
        .main-display-zone {
            width: 100%; background: var(--card-bg); border-radius: 12px;
            padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
            position: relative; overflow: hidden; min-height: 340px;
        }
        
        /* 靶紙視窗 (支援雙指縮放) */
        #targetWrapper {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            overflow: hidden; touch-action: none; position: relative;
        }
        svg { width: 100%; max-width: 290px; height: auto; border-radius: 50%; transform-origin: 0 0; }

        /* 錄影視窗 (大視窗優化) */
        #videoWrapper {
            width: 100%; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        #camCanvas { width: 100%; max-width: 320px; height: 240px; background: #000; border-radius: 8px; border: 1px solid #444; }
        .cam-status-lbl { font-size: 12px; margin-top: 6px; color: #ff3333; display: flex; align-items: center; gap: 4px; }

        /* 縮放與記分衝突控制列 */
        .control-mode-bar {
            width: 100%; background: #252a30; padding: 8px; border-radius: 6px;
            margin-top: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #3a4454; box-sizing: border-box;
        }
        .mode-switch { display: flex; align-items: center; gap: 6px; font-weight: bold; color: #2ecc71; }
        .mode-switch input { width: 16px; height: 16px; cursor: pointer; }

        .toggle-layer-box {
            width: 100%; margin-top: 8px; padding: 6px; background: #252525; border-radius: 6px;
            font-size: 11px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; box-sizing: border-box;
        }
        .toggle-layer-box label { display: flex; align-items: center; gap: 3px; cursor: pointer; }

        /* 底欄控制 */
        .btn-group { display: flex; gap: 8px; margin-top: 10px; width: 100%; }
        button.action-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .submit-btn { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .back-btn { background: #333; color: white; }

        .system-footer {
            margin-top: 15px; margin-bottom: 5px; width: 100%; text-align: center;
            font-size: 9px; color: #555; font-family: monospace;
            border-top: 1px dashed #2d2d2d; padding-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>北辰射箭紀錄表</h3>
    
    <div id="setupPanel" class="setup-overlay">
        <label style="font-weight: bold; color: var(--gold);">🛠️ 本局測驗與計時規格設定</label><br>
        總箭數：
        <select id="cfgTotalArrows">
            <option value="36">36 箭 (6組)</option>
            <option value="72" selected>72 箭 (12組)</option>
            <option value="18">18 箭 (3組)</option>
            <option value="6">6 箭 (1組測試)</option>
        </select><br>
        預備：<input type="number" id="cfgPrepSec" value="10" style="width: 40px;"> 秒 ｜ 
        射擊：<input type="number" id="cfgShootSec" value="90" style="width: 40px;"> 秒
        <button onclick="startSession()" style="margin-top:10px; padding:8px; width:90%; font-size:13px; font-weight:bold;">🎯 開局解鎖音訊通道</button>
    </div>

    <div class="score-table-container">
        <table>
            <thead>
                <tr>
                    <th>組</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>本組</th><th>累計</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody"></tbody>
        </table>
    </div>

    <div class="tech-grid">
        <div class="timer-zone">
            <div id="timerContainer" class="timer-box" onclick="toggleTimer()">
                <div id="timerDisplay" class="timer-digital">10</div>
                <div id="timerStatus" class="timer-status">⏱️ 點擊啟動</div>
            </div>
            <button class="reset-btn" onclick="resetTimer()">🔄 手動重置</button>
        </div>
        
        <div class="metrics-box">
            <div class="metric-line">🎯 篩選偏移: <span id="mAccuracy">--</span></div>
            <div class="metric-line">🧬 篩選直徑: <span id="mPrecision">--</span></div>
            <div class="metric-line">⚡ 篩選起伏: <span id="mStability">--</span></div>
        </div>
    </div>

    <button class="view-switch-btn" onclick="switchMainView()">
        🔄 切換顯示：<span id="currentViewName" style="color:var(--gold);">🎯 智能靶紙視窗</span>
    </button>

    <div class="main-display-zone">
        
        <div id="targetWrapper">
            <svg id="archeryTarget" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="150" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="135" fill="#ffffff" stroke="#ccc" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="120" fill="#121212" stroke="#444" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="105" fill="#121212" stroke="#444" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="90" fill="#00bfff" stroke="#0099cc" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="75" fill="#00bfff" stroke="#0099cc" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="60" fill="#ff4500" stroke="#cc3300" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="45" fill="#ff4500" stroke="#cc3300" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="30" fill="#ffd700" stroke="#e6b800" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="15" fill="#ffd700" stroke="#cc3300" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="7.5" fill="none" stroke="#cc3300" stroke-dasharray="1,1" stroke-width="0.5"/>
                <circle cx="150" cy="150" r="1" fill="#000"/>
                <g id="clusterLayerGroup"></g>
                <g id="arrowGroup"></g>
            </svg>
            
            <div class="control-mode-bar">
                <span style="color:#aaa;">💡 雙指可任意放大移動靶紙</span>
                <label class="mode-switch">
                    <input type="checkbox" id="chkScoreMode"> 📌 開啟點靶記分
                </label>
            </div>
        </div>

        <div id="videoWrapper">
            <canvas id="camCanvas"></canvas>
            <div id="camStatusLabel" class="cam-status-lbl">📷 鏡頭未啟動</div>
        </div>

        <div class="toggle-layer-box" id="layerToggleBox"></div>
    </div>

    <div class="btn-group">
        <button class="action-btn back-btn" onclick="undoLastArrow()">↩️ 刪除/修改上一箭</button>
        <button class="action-btn submit-btn" id="btnUpload" onclick="sendAllToSheets()" style="opacity:0.4;" disabled>💾 請先完成總箭數</button>
    </div>

    <div class="system-footer">
        NORTH STAR ARCHERY LAB SYSTEM © 2026<br>
        DESIGNED BY ROY | VERSION 1.3.0 完全體
    </div>
</div>

<video id="hiddenVideo" autoplay muted playsinline style="display:none;"></video>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzQpQfX.../exec"; 

    let TOTAL_ROWS = 0; let TOTAL_ARROWS_LIMIT = 0;
    const TARGET_CENTER = 150;
    let fullRoundData = [];
    let currentEnd = 0, currentIndex = 0, globalArrowCount = 0;
    let audioCtx = null;

    let currentView = "TARGET"; // TARGET 或是 VIDEO

    const STORM_COLORS = [
        { inner: "rgba(255, 0, 255, 0.4)",  outer: "rgba(255, 0, 255, 0.12)" },
        { inner: "rgba(0, 255, 255, 0.45)", outer: "rgba(0, 255, 255, 0.12)" },
        { inner: "rgba(255, 165, 0, 0.45)", outer: "rgba(255, 165, 0, 0.12)" },
        { inner: "rgba(155, 89, 182, 0.5)", outer: "rgba(155, 89, 182, 0.15)" },
        { inner: "rgba(46, 204, 113, 0.45)", outer: "rgba(46, 204, 113, 0.12)" },
        { inner: "rgba(241, 196, 15, 0.45)", outer: "rgba(241, 196, 黃金)" }
    ];

    // 👍 優化：大音量蜂鳴音效函式 (音量調至最大 1.0)
    function playBeep(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            let osc = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            // 音量拉滿到 1.0 (極限大聲)
            gainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);

            if (type === 'long') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.start(); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
                osc.stop(audioCtx.currentTime + 1.2);
            } else {
                osc.type = 'square'; osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc.start(); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.stop(audioCtx.currentTime + 0.25);
            }
        } catch(e) { console.log("音訊播不出來: ", e); }
    }

    // 初始化解鎖
    function startSession() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playBeep('short');

        TOTAL_ARROWS_LIMIT = parseInt(document.getElementById('cfgTotalArrows').value);
        TOTAL_ROWS = TOTAL_ARROWS_LIMIT / 6;
        fullRoundData = Array.from({ length: TOTAL_ROWS }, () => []);
        
        document.getElementById('timerDisplay').textContent = document.getElementById('cfgPrepSec').value;
        document.getElementById('setupPanel').style.display = 'none';
        
        initTable();
        initToggleCheckboxes();
        initPanZoomTarget(); // 啟動畫布雙指縮放功能
        initDelayedCamera(); // 自動在後台掛載延時鏡頭
    }

    function initTable() {
        const tableBody = document.getElementById('scoreTableBody'); tableBody.innerHTML = "";
        for (let e = 0; e < TOTAL_ROWS; e++) {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td style="background:#252525; font-weight:bold; color:#888;">${e + 1}</td>`;
            for (let a = 0; a < 6; a++) { tr.innerHTML += `<td id="cell-${e}-${a}" style="width:26px; font-weight:bold;">-</td>`; }
            tr.innerHTML += `<td class="end-total" id="endTotal-${e}">0</td>`;
            tr.innerHTML += `<td style="color:var(--gold); font-weight:bold;" id="runTotal-${e}">0</td>`;
            tableBody.appendChild(tr);
        }
        updateActiveHighlight();
    }

    function initToggleCheckboxes() {
        const box = document.getElementById('layerToggleBox'); box.innerHTML = "";
        for(let e=0; e<TOTAL_ROWS; e++) {
            let lbl = document.createElement('label');
            lbl.innerHTML = `<input type="checkbox" id="chk-end-${e}" checked onchange="handleLayerAndMetricsChange()"> <span>第${e+1}趟</span>`;
            box.appendChild(lbl);
        }
    }

    function updateActiveHighlight() {
        document.querySelectorAll('.active-cell').forEach(c => c.classList.remove('active-cell'));
        if (currentEnd < TOTAL_ROWS && currentIndex < 6) {
            const currentCell = document.getElementById(`cell-${currentEnd}-${currentIndex}`);
            if (currentCell) currentCell.classList.add('active-cell');
        }
    }

    // 👍 優化：大畫面/主視窗流暢切換邏輯
    function switchMainView() {
        const tWrap = document.getElementById('targetWrapper');
        const vWrap = document.getElementById('videoWrapper');
        const vName = document.getElementById('currentViewName');

        if (currentView === "TARGET") {
            tWrap.style.display = "none"; vWrap.style.display = "flex";
            currentView = "VIDEO"; vName.textContent = "📹 10秒動態回放視窗";
        } else {
            vWrap.style.display = "none"; tWrap.style.display = "flex";
            currentView = "TARGET"; vName.textContent = "🎯 智能靶紙視窗";
        }
    }

    // 👍 優化：手動重置秒數邏輯
    function resetTimer() {
        clearInterval(timerInterval);
        timerState = "IDLE";
        const box = document.getElementById('timerContainer');
        box.className = "timer-box";
        document.getElementById('timerDisplay').style.color = "#2ecc71";
        document.getElementById('timerDisplay').textContent = document.getElementById('cfgPrepSec').value;
        document.getElementById('timerStatus').innerHTML = "⏱️ 已重置<br>點擊重新啟動";
    }

    // 計時控制核心
    let timerInterval = null; let timerState = "IDLE"; let currentSeconds = 0;
    function toggleTimer() {
        const box = document.getElementById('timerContainer');
        const disp = document.getElementById('timerDisplay');
        const status = document.getElementById('timerStatus');

        if (timerState === "PREP" || timerState === "SHOOT") {
            clearInterval(timerInterval); timerState = "IDLE";
            box.className = "timer-box"; status.innerHTML = "⏸️ 已暫停<br>點擊續傳";
        } else {
            if (currentSeconds <= 0) {
                timerState = "PREP"; currentSeconds = parseInt(document.getElementById('cfgPrepSec').value);
                box.className = "timer-box prep-phase"; disp.style.color = "#ff3333";
                status.innerHTML = "🔴 預備中<br>請勿起弓";
                playBeep('short');
            } else {
                timerState = (box.classList.contains("shoot-phase")) ? "SHOOT" : "PREP";
            }

            timerInterval = setInterval(() => {
                currentSeconds--; disp.textContent = currentSeconds;
                
                // 倒數最後10秒黃燈警告響音
                if(currentSeconds <= 10 && currentSeconds > 0) { playBeep('short'); }

                if (timerState === "PREP" && currentSeconds <= 0) {
                    timerState = "SHOOT"; currentSeconds = parseInt(document.getElementById('cfgShootSec').value);
                    box.className = "timer-box shoot-phase"; disp.style.color = "#2ecc71";
                    status.innerHTML = "🏹 射擊中<br>計時獨立";
                    playBeep('long'); // 進入射擊長響
                } else if (timerState === "SHOOT" && currentSeconds <= 0) {
                    clearInterval(timerInterval); timerState = "IDLE"; box.className = "timer-box";
                    disp.style.color = "#ff3333"; status.innerHTML = "🛑 時間到";
                    playBeep('long'); playBeep('long');
                }
            }, 1000);
        }
    }

    // 👍 優化：大螢幕 10秒延時攝影核心代碼
    let videoStream = null; let camAnimationId = null; let frameBuffer = [];
    const DELAY_FRAMES = 10 * 24; 

    function initDelayedCamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 640, height: 480 }, audio: false })
        .then(stream => {
            videoStream = stream;
            const videoEl = document.getElementById('hiddenVideo'); videoEl.srcObject = stream;
            const canvas = document.getElementById('camCanvas'); const ctx = canvas.getContext('2d');
            const lbl = document.getElementById('camStatusLabel');
            canvas.width = 320; canvas.height = 240; frameBuffer = [];

            function processFrame() {
                const tempCanvas = document.createElement('canvas'); tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                frameBuffer.push(tempCanvas);
                
                if (frameBuffer.length >= DELAY_FRAMES) {
                    lbl.innerHTML = "<span style='color:#2ecc71;'>🟢 10秒動態回放已同步連結</span>";
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(frameBuffer.shift(), 0, 0);
                } else {
                    ctx.fillStyle = "#000"; ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle = "#3498db"; ctx.fillRect(0, canvas.height - 6, (frameBuffer.length / DELAY_FRAMES) * canvas.width, 6);
                    lbl.innerHTML = "⏳ 運科時空緩衝建立中... (" + Math.round((frameBuffer.length/DELAY_FRAMES)*100) + "%)";
                }
                camAnimationId = requestAnimationFrame(processFrame);
            }
            camAnimationId = requestAnimationFrame(processFrame);
        }).catch(() => { document.getElementById('camStatusLabel').textContent = "❌ 相機硬體無法存取"; });
    }

    // 👍 優化：手動雙指拖曳縮放 (Pan & Zoom) 核心防衝突演算法
    let scale = 1, posX = 0, posY = 0;
    let isDragging = false; let startX, startY;
    let touchStartDist = 0;

    function initPanZoomTarget() {
        const targetSvg = document.getElementById('archeryTarget');
        const wrapper = document.getElementById('targetWrapper');

        wrapper.addEventListener('touchstart', function(e) {
            // 如果開了「點靶記分模式」，不執行縮放移動
            if (document.getElementById('chkScoreMode').checked) return;

            if (e.touches.length === 2) {
                touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            } else if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX - posX; startY = e.touches[0].clientY - posY;
            }
        });

        wrapper.addEventListener('touchmove', function(e) {
            if (document.getElementById('chkScoreMode').checked) return;

            if (e.touches.length === 2 && touchStartDist > 0) {
                let dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                let factor = dist / touchStartDist;
                scale = Math.max(1, Math.min(4, scale * factor)); // 限制放大 1~4 倍
                touchStartDist = dist;
            } else if (e.touches.length === 1 && isDragging) {
                posX = e.touches[0].clientX - startX;
                posY = e.touches[0].clientY - startY;
                
                // 邊界限制預防靶紙飛出螢幕
                let maxPan = 150 * (scale - 1);
                posX = Math.max(-maxPan, Math.min(maxPan, posX));
                posY = Math.max(-maxPan, Math.min(maxPan, posY));
            }
            targetSvg.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
        });

        wrapper.addEventListener('touchend', function(e) {
            isDragging = false; if (e.touches.length < 2) touchStartDist = 0;
        });

        // 🎯 點擊靶紙事件：整合座標逆矩陣變換
        targetSvg.addEventListener('pointerdown', function(e) {
            // 必須打勾「開啟點靶記分」才能點！不然隨便亂碰都只是縮放
            if (!document.getElementById('chkScoreMode').checked) return;
            if (globalArrowCount >= TOTAL_ARROWS_LIMIT) return;

            const rect = targetSvg.getBoundingClientRect();
            // 逆算因縮放移動導致的實體 SVG 內部座標點
            const svgX = ((e.clientX - rect.left) / rect.width) * 300;
            const svgY = ((e.clientY - rect.top) / rect.height) * 300;
            const distance = Math.sqrt(Math.pow(svgX - TARGET_CENTER, 2) + Math.pow(svgY - TARGET_CENTER, 2));

            let res = { score: 0, display: "M" };
            const RING_RADII = [
                { r: 7.5, score: 10, display: "X" }, { r: 15, score: 10, display: "10" },
                { r: 30, score: 9, display: "9" },   { r: 45, score: 8, display: "8" },
                { r: 60, score: 7, display: "7" },   { r: 75, score: 6, display: "6" },
                { r: 90, score: 5, display: "5" },   { r: 105, score: 4, display: "4" },
                { r: 120, score: 3, display: "3" },  { r: 135, score: 2, display: "2" },
                { r: 150, score: 1, display: "1" }
            ];

            if (distance <= 150) {
                for (let zone of RING_RADII) { if (distance <= zone.r) { res = zone; break; } }
            }

            fullRoundData[currentEnd][currentIndex] = { 
                x: Math.max(0, Math.min(300, svgX)), y: Math.max(0, Math.min(300, svgY)), 
                score: res.score, display: res.display, dist: distance 
            };
            
            document.getElementById(`cell-${currentEnd}-${currentIndex}`).textContent = res.display;
            globalArrowCount++;
            recalculateTotals();
            handleLayerAndMetricsChange();

            currentIndex++;
            if (currentIndex > 5) { currentIndex = 0; currentEnd++; }

            if (globalArrowCount >= TOTAL_ARROWS_LIMIT) {
                const upBtn = document.getElementById('btnUpload'); upBtn.disabled = false; upBtn.style.opacity = "1";
                upBtn.textContent = "🎉 滿箭！上傳雲端資料庫";
                document.getElementById('chkScoreMode').checked = false; // 自動解除點靶狀態
            }
            updateActiveHighlight();
        });
    }

    function handleLayerAndMetricsChange() { renderClustersAndArrows(); calculateMultiEndMetrics(); }

    function calculateMultiEndMetrics() {
        let allSelectedArrows = []; let allScores = [];
        fullRoundData.forEach((endArrows, eIdx) => {
            if (document.getElementById(`chk-end-${eIdx}`)?.checked) {
                endArrows.forEach(a => { if (a) { allSelectedArrows.push(a); allScores.push(a.score); } });
            }
        });

        if (allSelectedArrows.length === 0) {
            document.getElementById('mAccuracy').textContent = "--";
            document.getElementById('mPrecision').textContent = "--";
            document.getElementById('mStability').textContent = "--";
            return;
        }

        let totalDist = allSelectedArrows.reduce((sum, a) => sum + a.dist, 0);
        document.getElementById('mAccuracy').textContent = (totalDist / allSelectedArrows.length).toFixed(1) + "px";

        let avgScore = allScores.reduce((sum, s) => sum + s, 0) / allScores.length;
        let variance = allScores.reduce((sum, s) => sum + Math.pow(s - avgScore, 2), 0) / allScores.length;
        document.getElementById('mStability').textContent = Math.sqrt(variance).toFixed(1);

        if (allSelectedArrows.length >= 3) {
            let coreArrows = [...allSelectedArrows];
            let globalX = coreArrows.reduce((sum, a) => sum + a.x, 0) / coreArrows.length;
            let globalY = coreArrows.reduce((sum, a) => sum + a.y, 0) / coreArrows.length;
            let worstIdx = 0; let maxD = -1;
            coreArrows.forEach((a, i) => {
                let d = Math.pow(a.x - globalX, 2) + Math.pow(a.y - globalY, 2); if (d > maxD) { maxD = d; worstIdx = i; }
            });
            coreArrows.splice(worstIdx, 1);

            let newX = coreArrows.reduce((sum, a) => sum + a.x, 0) / coreArrows.length;
            let newY = coreArrows.reduce((sum, a) => sum + a.y, 0) / coreArrows.length;
            let maxSpread = Math.max(...coreArrows.map(a => Math.sqrt(Math.pow(a.x - newX, 2) + Math.pow(a.y - newY, 2))));
            document.getElementById('mPrecision').textContent = (maxSpread * 2).toFixed(1) + "px";
        } else { document.getElementById('mPrecision').textContent = "--"; }
    }

    function renderClustersAndArrows() {
        const clusterGroup = document.getElementById('clusterLayerGroup');
        const arrowGroup = document.getElementById('arrowGroup');
        clusterGroup.innerHTML = ""; arrowGroup.innerHTML = "";

        fullRoundData.forEach((endArrows, eIdx) => {
            if (!document.getElementById(`chk-end-${eIdx}`)?.checked) return;
            let validArrows = endArrows.filter(a => a !== undefined); if (validArrows.length === 0) return;

            if (validArrows.length >= 3) {
                let allX = validArrows.reduce((sum, a) => sum + a.x, 0) / validArrows.length;
                let allY = validArrows.reduce((sum, a) => sum + a.y, 0) / validArrows.length;
                let maxSpread = Math.max(...validArrows.map(a => Math.sqrt(Math.pow(a.x - allX, 2) + Math.pow(a.y - allY, 2))));

                const outerStorm = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                outerStorm.setAttribute("cx", allX); outerStorm.setAttribute("cy", allY);
                outerStorm.setAttribute("r", Math.max(maxSpread + 4, 15));
                outerStorm.setAttribute("fill", STORM_COLORS[eIdx % 6].outer);
                outerStorm.setAttribute("stroke", STORM_COLORS[eIdx % 6].inner);
                outerStorm.setAttribute("stroke-width", "0.8"); outerStorm.setAttribute("stroke-dasharray", "3,2");
                clusterGroup.appendChild(outerStorm);
            }

            validArrows.forEach((arrow) => {
                if (arrow.display === "M") return;
                const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                c.setAttribute("cx", arrow.x); c.setAttribute("cy", arrow.y); c.setAttribute("r", "3.5");
                c.setAttribute("fill", STORM_COLORS[eIdx % 6].inner); c.setAttribute("stroke", "#fff"); c.setAttribute("stroke-width", "0.8");
                arrowGroup.appendChild(c);
            });
        });
    }

    function recalculateTotals() {
        let runningSum = 0;
        for (let e = 0; e < TOTAL_ROWS; e++) {
            let endSum = fullRoundData[e].reduce((sum, a) => sum + (a ? a.score : 0), 0);
            document.getElementById(`endTotal-${e}`).textContent = endSum;
            if (fullRoundData[e].length > 0) { runningSum += endSum; document.getElementById(`runTotal-${e}`).textContent = runningSum; }
            else { document.getElementById(`runTotal-${e}`).textContent = "-"; }
        }
    }

    function undoLastArrow() {
        if (globalArrowCount === 0) return;
        if (currentIndex === 0) { currentEnd--; currentIndex = 5; } else { currentIndex--; }
        fullRoundData[currentEnd].pop(); globalArrowCount--;
        document.getElementById(`cell-${currentEnd}-${currentIndex}`).textContent = "-";
        recalculateTotals(); handleLayerAndMetricsChange(); updateActiveHighlight();
        
        if (globalArrowCount < TOTAL_ARROWS_LIMIT) {
            const upBtn = document.getElementById('btnUpload'); upBtn.disabled = true; upBtn.style.opacity = "0.4";
            upBtn.textContent = "💾 請先完成總箭數";
        }
    }

    function sendAllToSheets() {
        let promises = [];
        fullRoundData.forEach((endArrows, index) => {
            if (endArrows.length === 0) return;
            let endScore = endArrows.reduce((sum, a) => sum + a.score, 0);
            let arrowDataString = endArrows.map((a, i) => `${a.score}|${Math.round(a.x-TARGET_CENTER)},${Math.round(a.y-TARGET_CENTER)}|${i+1}`).join('#');
            let packedArrows = `100|0,0|0$${arrowDataString}`;

            promises.push(fetch(GAS_API_URL, {
                method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "save_training", userId: "BC-202606-001",
                    distance: "運科雙層散佈靶", targetSize: "標準加權彈著靶",
                    endNumber: index + 1, endScore: endScore, isAlert: endScore < 45 ? 1 : 0, packedArrows: packedArrows
                })
            }));
        });

        Promise.all(promises).then(() => {
            alert(`🎉 運科同步成功！數據已寫入雲端大數據庫！`);
            location.reload();
        }).catch(() => { alert("連線超時，請重新檢查網路。"); });
    }
</script>
